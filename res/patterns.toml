# Pattern definitions for steamclient.so and steamui.so hook targets.
# Loaded at runtime. Update this file to adapt to Steam updates.
#
# follow modes:
#   "none": pattern matches the function prologue directly
#   "relative": pattern matches a call site; follow E8/E9 rel32 to callee
#   "upward": pattern matches function body; scan upward for prologue bytes
#   "call": pattern matches a context; scan forward to the last CALL before RET
#           and optionally validate the callee with callee_pattern

[steamclient."CUser::CheckAppOwnership"]
follow = "relative"
pattern = "E8 ? ? ? ? 88 45 ? 83 C4 10 84 C0 0F 84 ? ? ? ? 8B 45 ? 80 7D ? 00"

[steamclient."CUser::GetSubscribedApps"]
