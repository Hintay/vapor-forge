# This deliberately broad candidate starts at the stable ClientID buffer
# initialization. The tools scanner and runtime parser validate the later
# CConfigStore access, key reference, and SetUint64 call before using it.
[steamclient."CConfigStore::ClientIDConfigAccess"]
follow = "none"
pattern = "C7 86 80 02 00 00 00 00 00 00 8D BE 80 02 00 00 C7 86 84 02 00 00 00 00 00 00"
optional = true

# Newer ubuntu12 builds moved the ClientID buffer by four bytes but still unpack
# the random 64-bit value through eax/edx. Keep this separate from the steamrt
# SSE movq shape below so both variants stay mutually exclusive.
[[steamclient."CConfigStore::ClientIDConfigAccess".variants]]
pattern = "C7 86 84 02 00 00 00 00 00 00 8D BE 84 02 00 00 C7 86 88 02 00 00 00 00 00 00 83 EC 08 6A 08 57 E8 ? ? ? ? 8B 96 88 02 00 00"

# steamrt writes the 64-bit ClientID value into the reserved stack area before
# pushing the remaining SetUint64 arguments.
[[steamclient."CConfigStore::ClientIDConfigAccess".variants]]
pattern = "8D 83 ? ? ? ? 80 BE 12 06 00 00 00 8B 00 8D 88 60 0D 00 00 8B 80 60 0D 00 00 8B 50 2C 8D 83 ? ? ? ? 74 ? 8D 83 ? ? ? ? 83 EC 14 66 0F D6 0C 24 50 6A 01 51 FF D2"

