# Vapor Forge configuration.
# Fields without a leading "#" are recommended defaults and match runtime
# defaults. Vapor Forge keeps these fields present and sorted.
# Lines starting with "#" are examples. Uncomment them only when needed.

# Runtime logging, diagnostics, and pattern hotfix source.
[runtime]
log_level = "info"          # trace, debug, info, warn, error
diagnostics = false         # write extra hook/module diagnostics to logs
# Source changes take effect when SteamClient hooks next install.
# Downloaded candidates are validated on a later matching module installation.
# Clearing this URL leaves validated active caches enabled.
# patterns_url = "https://example.invalid/patterns/{arch}/{family}.toml"

# SteamUI toast notifications.
[toast]
enabled = true
init = true                 # show a startup toast after SteamUI bridge is ready

# Family sharing concurrent-play unlock.
[apps.shared]
enabled = true
# include = [480, 730]      # only unlock these family-shared apps
# exclude = [730]           # unlock all family-shared apps except these

# Cloud sync control for apps controlled by Vapor Forge.
[cloud]
backend = "disabled"        # disabled, local, or cumulus

[cloud.local]
path = ""

# Optional Syncthing readiness and garbage-collection boundary.
[cloud.local.syncthing]
enabled = false
url = "http://127.0.0.1:8384"
api_key = ""
folder_id = ""             # Folder whose path exactly equals cloud.local.path
timeout_ms = 2000

[cloud.cumulus]
server_url = ""             # Cumulus origin, for example https://cloud.example.com
token = ""                  # Cumulus device bearer token
timeout_connect_ms = 5000
timeout_ms = 15000

# Ticket generation and ticket cache behavior.
[ticket]
cache = "disk"              # disk or session
auto_delegate = false       # enable delegate mode when the helper detects it

# Manifest request-code providers for controlled apps, tried in order.
# An entry is either a built-in name ("20770407", "manifestdex", "opensteamtool",
# "wudrm", "steamrun") or a table describing your own endpoint, so a new source
# can be added without waiting for a new build. Tables may span several lines:
#
#   providers = [
#       "manifestdex",
#       {
#           name = "mirror",                    # shown in logs; must be unique
#           url = "https://my.mirror/{gid}",    # {gid} required; {depotId} and
#                                               # {appId} also substituted
#           user_agent = "MyClient/1.0",        # optional
#           min_interval_ms = 1000,             # optional; overrides the default below
#       },
#       {
#           name = "jsonsrc",
#           url = "https://x/{gid}",
#           format = "json",                    # "plain" (default) or "json"
#           json_field = "content",             # required when format = "json"
#       },
#   ]
#
# An entry that fails these rules is skipped and the rest of the chain still
# runs; `vapor-forge-config-check` lists what would be skipped.
[manifest]
providers = ["20770407", "manifestdex", "opensteamtool", "wudrm", "steamrun"]
timeout_connect_ms = 5000
timeout_ms = 15000
# Minimum gap between two requests to the same provider. These are small shared
# services that degrade for everyone when one client bursts, and Steam asks for
# one code per depot, so leave this at 1s unless a provider documents otherwise.
min_interval_ms = 1000

# Offline achievement schema support.
[achievements]
offline_schema = false

# Native library injection into launched games.
[library_inject]
helper_path = ""            # 64-bit Proton helper .so path

# Lua script search paths. Steam's config/lua directory is also scanned.
[scripting]
paths = []

# Development API socket for local testing and manual toast/debug commands.
# [debug]
# control_api = false

# Apps the current account does not own but Vapor Forge should present as owned.
# [[apps.inject]]
# id = 480
# dlc = [12345, 67890]
# ticket = "forge"          # forge or delegate
# purchase_time = 0         # 0 = auto

# Map an app to another app id for networking/rich presence compatibility.
# [app_avatar]
# 480 = 730
# 0 = 730                   # wildcard for all unowned apps

# Apply avatar mappings only when launch options contain a flag.
# [[app_avatar.rules]]
# flag = "-onlinefix"
# avatar = 480
# apps = [480]
# exclude = [730]

# Inject a native library into matching launched games through LD_PRELOAD.
# [[library_inject.libs]]
# path = "/home/user/mylib.so"
# flag = "-onlinefix"
# apps = [480]
# exclude = [730]
