[package]
name = "vapor-forge-hooks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = []
tools = [
    "dep:prost",
    "dep:vapor-forge-abi",
    "dep:vapor-forge-config",
]

[[bin]]
name = "vapor-forge-packet-tool"
path = "src/bin/vapor-forge-packet-tool.rs"
required-features = ["tools"]

[dependencies]
iced-x86.workspace = true
libc.workspace = true
serde_json.workspace = true
prost = { workspace = true, optional = true }
vapor-forge-abi = { path = "../steam-abi", optional = true }
vapor-forge-config = { path = "../config", optional = true }
vapor-forge-hook-boundary = { path = "../hook-boundary" }
vapor-forge-packet-inspect = { path = "../packet-inspect" }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tracing.workspace = true
vapor-forge-config = { path = "../config" }
vapor-forge-diagnostics = { path = "../diagnostics" }

[target.'cfg(target_family = "unix")'.dev-dependencies]
vapor-forge-features = { path = "../features" }

[target.'cfg(target_os = "linux")'.dependencies]
arc-swap.workspace = true
inotify.workspace = true
once_cell.workspace = true
retour.workspace = true
tracing.workspace = true
vapor-forge-abi = { path = "../steam-abi" }
vapor-forge-config = { path = "../config" }
vapor-forge-diagnostics = { path = "../diagnostics" }
vapor-forge-features = { path = "../features" }
vapor-forge-memory = { path = "../memory" }
vapor-forge-patterns = { path = "../patterns" }
prost.workspace = true
vapor-forge-scripting = { path = "../scripting" }
vapor-forge-inject-protocol = { path = "../inject-protocol" }
