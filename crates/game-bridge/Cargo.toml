[package]
name = "vapor-forge-game-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = []
tools = ["dep:vapor-forge-tool-support"]

[[bin]]
name = "vapor-forge-game-bridge-tool"
path = "src/bin/vapor-forge-game-bridge-tool.rs"
required-features = ["tools"]

# No external dependencies in the injected build. Pure Rust, buildable for
# any target (i686 / x86_64); the tool binary alone pulls the shared parser.
[dependencies]
vapor-forge-tool-support = { path = "../tool-support", optional = true }
