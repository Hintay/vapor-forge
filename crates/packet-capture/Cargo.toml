[package]
name = "vapor-forge-packet-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = []
tools = [
    "dep:serde_json",
    "dep:vapor-forge-config",
    "dep:vapor-forge-features",
]

[[bin]]
name = "vapor-forge-packet-tool"
path = "src/bin/vapor-forge-packet-tool.rs"
required-features = ["tools"]

[dependencies]
prost.workspace = true
serde_json = { workspace = true, optional = true }
vapor-forge-steam-protocol = { path = "../steam-protocol" }
vapor-forge-config = { path = "../config", optional = true }
vapor-forge-features = { path = "../features", optional = true }
