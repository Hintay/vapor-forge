[package]
name = "vapor-forge-pe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = []
tools = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "vapor-forge-pe-scan"
path = "src/bin/vapor-forge-pe-scan.rs"
required-features = ["tools"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
