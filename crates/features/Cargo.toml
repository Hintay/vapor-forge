[package]
name = "vapor-forge-features"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = []
tools = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "vapor-forge-ticket-tool"
path = "src/bin/vapor-forge-ticket-tool.rs"
required-features = ["tools"]

[dependencies]
prost.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
vapor-forge-abi = { path = "../steam-abi" }
vapor-forge-config = { path = "../config" }
vapor-forge-core = { path = "../runtime-core" }
vapor-forge-packet-inspect = { path = "../packet-inspect" }
tracing.workspace = true
ureq.workspace = true
