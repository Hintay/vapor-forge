name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_ZIGBUILD_VERSION: 0.23.0
  STEAM_GLIBC_BASELINE: "2.17"
  ZIG_VERSION: 0.16.0
  ZIG_X86_64_LINUX_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: i686-unknown-linux-gnu, x86_64-unknown-linux-gnu

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: Check lockfile
        run: cargo check --workspace --locked

      - name: Architecture boundaries
        run: scripts/check-architecture.py

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The tool binaries sit behind `tools`, so the run above never builds
      # them. Without this they are the only unchecked code in the workspace.
      - name: Clippy (tool binaries)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # `--all-features` so the tool binaries' own tests actually run; without
      # it they are compiled but never executed.
      - name: Tests
        run: cargo test --workspace --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Check workspace
        run: cargo check --workspace --all-features --locked

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates git \
            gcc g++ gcc-multilib g++-multilib \
            libc6-dev-i386 make pkg-config \
            binutils python3 xz-utils

      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-unknown-linux-gnu, x86_64-unknown-linux-gnu

      - name: Cache cargo registry + release tools + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
            target
          key: build-glibc-${{ env.STEAM_GLIBC_BASELINE }}-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-glibc-${{ env.STEAM_GLIBC_BASELINE }}-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ runner.os }}-

      - name: Install Zig
        run: |
          set -eux
          archive="${RUNNER_TEMP}/zig.tar.xz"
          install_dir="${RUNNER_TEMP}/zig"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_X86_64_LINUX_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: |
          set -eux
          installed_version="$(cargo-zigbuild --version 2>/dev/null || true)"
          if [ "$installed_version" != "cargo-zigbuild ${CARGO_ZIGBUILD_VERSION}" ]; then
            cargo install cargo-zigbuild --locked --force --version "${CARGO_ZIGBUILD_VERSION}"
          fi

      - name: Compute version metadata
        id: version
        env:
          HEAD_TIMESTAMP: ${{ github.event.head_commit.timestamp || '' }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at || '' }}
        run: |
          set -eux
          version_source="${HEAD_TIMESTAMP:-$PR_UPDATED_AT}"
          if [ -n "$version_source" ]; then
            version="$(date -u -d "$version_source" '+%Y%m%d%H%M%S')"
          else
            version="$(date -u '+%Y%m%d%H%M%S')"
          fi
          commit="${GITHUB_SHA:0:12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
          else
            tag_version=""
          fi

          {
            echo "version=$version"
            echo "commit=$commit"
            echo "tag_version=$tag_version"
          } >> "$GITHUB_OUTPUT"

      - name: Clippy (i686 + x86_64)
        run: |
          set -eux
          cargo clippy -p vapor-forge-audit-loader --target i686-unknown-linux-gnu --locked -- -D warnings
          cargo clippy -p vapor-forge-audit-loader --target x86_64-unknown-linux-gnu --locked -- -D warnings
          cargo clippy -p vapor-forge-proton-inject --target x86_64-unknown-linux-gnu --locked -- -D warnings

      - name: Build release
        env:
          CFLAGS_i686_unknown_linux_gnu: -DLUAJIT_NO_UNWIND
          CFLAGS_x86_64_unknown_linux_gnu: -DLUAJIT_NO_UNWIND
          GIT_COMMIT: ${{ steps.version.outputs.commit }}
          VAPOR_FORGE_BUILD_VERSION: ${{ steps.version.outputs.tag_version || steps.version.outputs.version }}
        run: |
          set -eux
          cargo zigbuild --release -p vapor-forge-audit-loader --target "i686-unknown-linux-gnu.${STEAM_GLIBC_BASELINE}" --locked
          cargo zigbuild --release -p vapor-forge-audit-loader --target "x86_64-unknown-linux-gnu.${STEAM_GLIBC_BASELINE}" --locked
          cargo zigbuild --release -p vapor-forge-proton-inject --target "x86_64-unknown-linux-gnu.${STEAM_GLIBC_BASELINE}" --locked

      - name: Verify glibc baseline
        run: |
          set -eux
          scripts/check-glibc-baseline.py "${STEAM_GLIBC_BASELINE}" \
            target/i686-unknown-linux-gnu/release/libvapor_forge.so \
            target/x86_64-unknown-linux-gnu/release/libvapor_forge.so \
            target/x86_64-unknown-linux-gnu/release/libvapor_forge_proton_inject.so

      - name: Generate third-party notices
        run: scripts/generate-third-party-licenses.py dist/THIRD_PARTY_LICENSES.md

      - name: Stage artifacts
        run: |
          set -eux
          mkdir -p dist/i686-unknown-linux-gnu dist/x86_64-unknown-linux-gnu
          cp target/i686-unknown-linux-gnu/release/libvapor_forge.so dist/i686-unknown-linux-gnu/
          cp target/x86_64-unknown-linux-gnu/release/libvapor_forge.so dist/x86_64-unknown-linux-gnu/
          cp target/x86_64-unknown-linux-gnu/release/libvapor_forge_proton_inject.so dist/x86_64-unknown-linux-gnu/
          cp LICENSE README.md dist/

      - name: Compute artifact name
        id: meta
        run: echo "name=vapor-forge-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Package
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p bundle
          cp -R artifacts/. bundle/
          tar -C bundle -czf "vapor-forge-${VERSION}-linux.tar.gz" .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Vapor Forge ${{ github.ref_name }}
          files: vapor-forge-*-linux.tar.gz
          generate_release_notes: true
          draft: true
