[workspace]
members = [
    "crates/audit-loader",
    "crates/diagnostics",
    "crates/hook-boundary",
    "crates/hooks",
    "crates/memory",
    "crates/patterns",
    "crates/runtime-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = ""
rust-version = "1.80"

[workspace.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "instr_info"] }
libc = "0.2"
object = { version = "0.39.1", default-features = false, features = ["read"] }
once_cell = "1"
parking_lot = "0.12"
retour = "0.4.0-alpha.4"
thiserror = "2"
tracing = "0.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
