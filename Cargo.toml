[workspace]
members = [
    "crates/audit-loader",
    "crates/diagnostics",
    "crates/features",
    "crates/hook-boundary",
    "crates/hooks",
    "crates/inject-protocol",
    "crates/memory",
    "crates/packet-inspect",
    "crates/pe",
    "crates/patterns",
    "crates/config",
    "crates/runtime-core",
    "crates/scripting",
    "crates/steam-abi",
    "crates/proton-inject",
]
default-members = [
    "crates/audit-loader",
    "crates/diagnostics",
    "crates/features",
    "crates/hook-boundary",
    "crates/hooks",
    "crates/inject-protocol",
    "crates/memory",
    "crates/packet-inspect",
    "crates/pe",
    "crates/patterns",
    "crates/config",
    "crates/runtime-core",
    "crates/scripting",
    "crates/steam-abi",
    "crates/proton-inject",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = ""
rust-version = "1.80"

[workspace.dependencies]
arc-swap = "1.9"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "instr_info", "code_asm"] }
inotify = "0.11"
keyvalues-parser = "0.2.4"
libc = "0.2"
mlua = { version = "0.10", features = ["luajit", "vendored"] }
memchr = "2"
object = { version = "0.39.1", default-features = false, features = ["read"] }
once_cell = "1"
prost = "0.14"
retour = "0.4.0-alpha.4"
sha2 = "0.10"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22.27"
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
