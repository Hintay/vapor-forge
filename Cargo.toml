[workspace]
members = [
    "crates/audit-loader",
    "crates/sync-journal",
    "crates/cloud-core",
    "crates/cloud-cumulus",
    "crates/cloud-local",
    "crates/cloud-rpc",
    "crates/diagnostics",
    "crates/features",
    "crates/hooks",
    "crates/game-bridge",
    "crates/memory",
    "crates/packet-capture",
    "crates/pe",
    "crates/patterns",
    "crates/config",
    "crates/runtime-core",
    "crates/scripting",
    "crates/steam-native-abi",
    "crates/steam-protocol",
    "crates/tool-support",
    "crates/hook-engine",
    "crates/proton-inject",
]
default-members = [
    "crates/audit-loader",
    "crates/sync-journal",
    "crates/cloud-core",
    "crates/cloud-cumulus",
    "crates/cloud-local",
    "crates/cloud-rpc",
    "crates/diagnostics",
    "crates/features",
    "crates/hooks",
    "crates/game-bridge",
    "crates/memory",
    "crates/packet-capture",
    "crates/pe",
    "crates/patterns",
    "crates/config",
    "crates/runtime-core",
    "crates/scripting",
    "crates/steam-native-abi",
    "crates/steam-protocol",
    "crates/tool-support",
    "crates/hook-engine",
    "crates/proton-inject",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = ""
rust-version = "1.80"

[workspace.dependencies]
arc-swap = "1.9"
base64 = "0.22"
fs2 = "0.4"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "instr_info", "code_asm"] }
# The `stream` default feature pulls tokio + futures; the watcher only uses the
# blocking API, and this library is injected into Steam's process.
inotify = { version = "0.11", default-features = false }
keyvalues-parser = "0.2.4"
libc = "0.2"
mlua = { version = "0.10", features = ["luajit", "vendored", "send"] }
memchr = "2"
object = { version = "0.39.1", default-features = false, features = ["read"] }
once_cell = "1"
prost = "0.14"
retour = "0.4.0-alpha.4"
structsy = { version = "0.5", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22.27"
tracing = "0.1.44"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
