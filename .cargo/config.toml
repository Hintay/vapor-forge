[target.i686-unknown-linux-gnu]
linker = "gcc"
rustflags = ["-C", "link-arg=-m32"]

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

[alias]
build-main = "build -p vapor-forge-audit-loader --target i686-unknown-linux-gnu"
build-main32 = "build -p vapor-forge-audit-loader --target i686-unknown-linux-gnu"
build-main64 = "build -p vapor-forge-audit-loader --target x86_64-unknown-linux-gnu"
build-inject = "build -p vapor-forge-proton-inject --target x86_64-unknown-linux-gnu"
build-main-release = "build --release -p vapor-forge-audit-loader --target i686-unknown-linux-gnu"
build-main32-release = "build --release -p vapor-forge-audit-loader --target i686-unknown-linux-gnu"
build-main64-release = "build --release -p vapor-forge-audit-loader --target x86_64-unknown-linux-gnu"
build-inject-release = "build --release -p vapor-forge-proton-inject --target x86_64-unknown-linux-gnu"

[env]
VAPOR_FORGE_PROJECT = "vapor-forge"
